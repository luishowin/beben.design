<!DOCTYPE html>
<html lang="en" style="--accent: var(--neon-blue); --accent-glow: rgba(25,198,255,0.3)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Skystack — ARCADIA</title>
    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ARCADIA">
    <link rel="manifest" href="/games/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/games/icons/apple-touch-icon-180.png">
    <link rel="icon" href="/games/icons/icon-192.png" type="image/png">

    <link rel="stylesheet" href="../arcade.css">
    <script src="../arcade.js"></script>
</head>
<body>

<main class="arc-stage"><canvas id="game" class="arc-surface"></canvas></main>

<script>
(function () {
    'use strict';

    var canvas = document.getElementById('game');
    var view = Arcade.fitCanvas(canvas, { aspect: 0.66, maxW: 420 });

    var PERFECT_PX = 4;

    var stack, current, score, t, dead, camY, hue;

    function slabH() { return Math.max(22, view.h * 0.045); }
    function baseW() { return view.w * 0.55; }

    function reset() {
        score = 0;
        t = 0;
        dead = false;
        camY = 0;
        hue = 190;   // dusk ramp: cyan through purple
        var h = slabH();
        stack = [{ x: view.w / 2, w: baseW(), y: 0, hue: hue }];
        newSlab();
        Arcade.ui.setScore('0');
    }

    function newSlab() {
        hue = 190 + ((hue - 190 + 14) % 95);
        var top = stack[stack.length - 1];
        current = {
            w: top.w,
            y: stack.length,
            hue: hue,
            // oscillation params — evaluated from elapsed time, frame-rate-proof
            amp: (view.w - top.w) / 2 + top.w * 0.35,
            speed: 1.6 + Math.min(score * 0.07, 2.6),
            t0: t
        };
    }

    function currentX() {
        return view.w / 2 + Math.sin((t - current.t0) * current.speed) * current.amp;
    }

    function drop() {
        if (dead || !current) return;
        var x = currentX();
        var top = stack[stack.length - 1];
        var delta = x - top.x;

        if (Math.abs(delta) <= PERFECT_PX) {
            // perfect: keep width, small regrow bonus
            var w = Math.min(top.w + 6, baseW());
            stack.push({ x: top.x, w: w, y: current.y, hue: current.hue, flash: 0.35 });
            score++;
            Arcade.audio.play('merge');
            Arcade.haptics.buzz('success');
        } else {
            var overlap = top.w - Math.abs(delta);
            if (overlap <= 0) { miss(); return; }
            var nx = (Math.max(x - current.w / 2, top.x - top.w / 2) +
                      Math.min(x + current.w / 2, top.x + top.w / 2)) / 2;
            stack.push({ x: nx, w: overlap, y: current.y, hue: current.hue });
            score++;
            Arcade.audio.play('drop');
            Arcade.haptics.buzz('light');
        }
        Arcade.ui.setScore(String(score));
        newSlab();
    }

    function miss() {
        dead = true;
        current = null;
        Arcade.audio.play('boom');
        Arcade.haptics.buzz('error');
        loop.pause();
        var res = Arcade.scores.submit('skystack', score);
        Arcade.ui.gameOver({
            score: score, best: res.best, isNew: res.isNew,
            onReplay: function () { reset(); loop.resume(); }
        });
    }

    document.body.addEventListener('pointerdown', function (e) {
        if (e.target.closest('.arc-bar, .arc-overlay')) return;
        drop();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === ' ') { e.preventDefault(); drop(); }
    });

    function slabScreenY(level) {
        var h = slabH();
        return view.h - (level + 1) * h + camY;
    }

    function update(dt) {
        t += dt;
        stack.forEach(function (s) { if (s.flash) s.flash = Math.max(0, s.flash - dt); });

        // camera follows the stack top up
        var targetCam = Math.max(0, (stack.length + 1) * slabH() - view.h * 0.55);
        camY += (targetCam - camY) * Math.min(1, dt * 6);
    }

    function render() {
        var p = Arcade.palette();
        var ctx = view.ctx;
        ctx.fillStyle = p.bgSoft;
        ctx.fillRect(0, 0, view.w, view.h);

        // pixel-art sky: hard band gradient, deep space to warm sunset
        var BANDS = ['#14112E', '#1B1440', '#251750', '#33205F', '#442A6A', '#5A3570', '#74416F', '#915266', '#B1665B', '#CF7A4E'];
        var bh = view.h / BANDS.length;
        for (var bi = 0; bi < BANDS.length; bi++) {
            ctx.fillStyle = BANDS[bi];
            ctx.fillRect(0, bi * bh, view.w, bh + 1);
        }

        // pixel stars (deterministic; some sparkle)
        ctx.fillStyle = p.headers;
        for (var si = 0; si < 40; si++) {
            var sx = ((si * 89) % 97) / 97 * view.w;
            var sy = ((si * 41) % 61) / 61 * view.h;
            var ss = (si % 7 === 0) ? 2 : 1;
            ctx.globalAlpha = (si % 3 === 0) ? 0.5 : 0.22;
            ctx.fillRect(sx, sy, ss, ss);
            if (si % 11 === 0) {
                ctx.globalAlpha = 0.35;
                ctx.fillRect(sx - 1, sy, 4, 1);
                ctx.fillRect(sx, sy - 1, 1, 4);
            }
        }
        ctx.globalAlpha = 1;

        // pixel moon
        var MOON = ['..YYYY..', '.YYYYYY.', 'YYYgYYYY', 'YYYYYYYY', 'YYgYYYYY', '.YYYYYY.', '..YYYY..'];
        var mp = 4, mx = view.w - 64, my = 24;
        for (var myy = 0; myy < MOON.length; myy++) {
            for (var mxx = 0; mxx < MOON[myy].length; mxx++) {
                var mch = MOON[myy][mxx];
                if (mch === '.') continue;
                ctx.fillStyle = mch === 'Y' ? '#FFF3D0' : '#E0C89A';
                ctx.fillRect(mx + mxx * mp, my + myy * mp, mp, mp);
            }
        }

        // slow blocky sunset clouds
        ctx.fillStyle = 'rgba(255,190,150,0.16)';
        for (var ci = 0; ci < 3; ci++) {
            var cw = view.w * (0.16 + ci * 0.05);
            var cx = view.w - ((t * (6 + ci * 3) + ci * view.w * 0.45) % (view.w + cw * 2));
            var cy = view.h * (0.14 + ci * 0.1);
            ctx.fillRect(cx, cy, cw, 6);
            ctx.fillRect(cx + cw * 0.15, cy - 4, cw * 0.6, 4);
            ctx.fillRect(cx + cw * 0.4, cy - 7, cw * 0.3, 3);
        }

        // faint altitude lines
        ctx.strokeStyle = p.gridLine;
        ctx.lineWidth = 1;
        var h = slabH();
        for (var y = (camY % (h * 2)); y < view.h; y += h * 2) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(view.w, y); ctx.stroke();
        }

        function drawSlab(s, x) {
            var sy = slabScreenY(s.y);
            if (sy > view.h + h || sy < -h) return;
            ctx.fillStyle = 'hsl(' + s.hue + ', 85%, ' + (s.flash ? 74 : 60) + '%)';
            ctx.fillRect(x - s.w / 2, sy, s.w, h - 2);
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.fillRect(x - s.w / 2, sy + h - 6, s.w, 4);
        }

        stack.forEach(function (s) { drawSlab(s, s.x); });
        if (current) drawSlab(current, currentX());

        // ── drop guide: the thin window between the moving slab and the
        // stack top. Rails mark the target width; the bright band on the
        // moving slab is exactly where it would land; accent = perfect.
        if (current && !dead) {
            var top = stack[stack.length - 1];
            var delta = currentX() - top.x;
            var overlap = top.w - Math.abs(delta);
            var curSy = slabScreenY(current.y);

            // rails bracket the moving slab: from the stack top up past it
            ctx.globalAlpha = 0.22;
            ctx.fillStyle = p.headers;
            ctx.fillRect(top.x - top.w / 2 - 2, curSy - 6, 2, h + 6);
            ctx.fillRect(top.x + top.w / 2, curSy - 6, 2, h + 6);
            ctx.globalAlpha = 1;

            if (overlap > 0) {
                var x0 = Math.max(currentX() - current.w / 2, top.x - top.w / 2);
                var x1 = Math.min(currentX() + current.w / 2, top.x + top.w / 2);
                ctx.fillStyle = Math.abs(delta) <= PERFECT_PX ? p.accent : 'rgba(255,255,255,0.35)';
                ctx.fillRect(x0, curSy, x1 - x0, h - 2);
            }
        }

        if (score === 0 && !dead) {
            ctx.fillStyle = p.muted;
            ctx.font = '600 13px ui-monospace, Menlo, Consolas, monospace';
            ctx.textAlign = 'center';
            ctx.fillText(Arcade.env.touch ? 'TAP TO DROP — LAND IN THE RAILS' : 'SPACE TO DROP — LAND IN THE RAILS', view.w / 2, view.h * 0.3);
        }
    }

    var loop = Arcade.loop({ update: update, render: render });

    Arcade.init({
        slug: 'skystack',
        title: 'Skystack',
        accent: 'blue',
        jingles: {
            best: [[440, 0.07], [554, 0.07], [659, 0.07], [880, 0.07], [1109, 0.18]],
            over: [[349, 0.1], [294, 0.1], [247, 0.2]]
        },
        onPause: function () { loop.pause(); },
        onResume: function () { loop.resume(); }
    });

    view.refit();
    reset();
    loop.start();
})();
</script>

</body>
</html>
