<!DOCTYPE html>
<html lang="en" style="--accent: var(--neon-orange); --accent-glow: rgba(255,155,33,0.3)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Dune Surf — ARCADIA</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arcadia">
    <link rel="manifest" href="/games/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/games/icons/apple-touch-icon-180.png">
    <link rel="icon" href="/games/icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="../arcade.css">
    <script src="../arcade.js"></script>
</head>
<body>

<main class="arc-stage"><canvas id="game" class="arc-surface"></canvas>
    <span class="arc-proto">Beta</span>
</main>

<script>
(function () {
    'use strict';

    /* DUNE SURF (endless desert carve, 16:9)
       The dune never ends. The ride floats and carves rather than pops:
       low gravity, a gentle glide while holding, soft landings. Rocks,
       cacti, crevasses and low-flying birds end the run. */

    var canvas = document.getElementById('game');
    var view = Arcade.fitCanvas(canvas, { aspect: 16 / 9, maxW: 900 });

    var GRAV = 1150, SEG = 140;

    var camX, rideX, rideY, rideVY, grounded, slopeDeg, rot, flips, flipBase;
    var runSpeed, dist, coins, bonus, over, t, holding, holdT, hBase;
    var heights, lastX, chasms, rocks, cacti, birds, coinSets, buntings;

    function reset() {
        camX = 0;
        rideX = 0; rideY = 0; rideVY = 0;
        grounded = true; slopeDeg = 0; rot = 0; flips = 0; flipBase = 0;
        runSpeed = 220;
        dist = 0; coins = 0; bonus = 0;
        over = false; t = 0;
        holding = false; holdT = 0;
        hBase = view.h;
        heights = [{ x: -SEG * 2, h: view.h * 0.68 }, { x: -SEG, h: view.h * 0.68 }, { x: 0, h: view.h * 0.68 }];
        lastX = 0;
        chasms = [];
        rocks = [];
        cacti = [];
        birds = [];
        coinSets = [];
        buntings = [];
        ensureAhead(view.w * 2);
        rideY = groundAt(0) - 6;
        Arcade.ui.setScore('000');
    }

    function rnd(a, b) { return a + Math.random() * (b - a); }

    function ensureAhead(upto) {
        while (lastX < upto) {
            var prev = heights[heights.length - 1];
            // occasional crevasse: no ground for a span
            if (lastX > 600 && Math.random() < 0.09) {
                var gw = rnd(100, 190);
                chasms.push({ x0: lastX, w: gw });
                lastX += gw;
                heights.push({ x: lastX, h: prev.h + rnd(-40, 40) });
                continue;
            }
            var nh = prev.h + rnd(-60, 60);
            nh = Math.max(view.h * 0.55, Math.min(view.h * 0.82, nh));
            lastX += SEG;
            heights.push({ x: lastX, h: nh });
            // ground hurdles: rocks and cacti
            if (lastX > 900 && Math.random() < 0.12) {
                if (Math.random() < 0.5) rocks.push({ x: lastX - SEG / 2, r: rnd(9, 15) });
                else cacti.push({ x: lastX - SEG / 2, h: rnd(20, 30) });
            }
            // birds: low fliers you must not jump into
            if (lastX > 1400 && Math.random() < 0.16) {
                var bg = heights[heights.length - 1];
                birds.push({ x: lastX - SEG / 2, y: bg.h - rnd(56, 88), fl: Math.random() * 6, taken: false });
            }
            // coin arc over the crest
            if (Math.random() < 0.35) {
                var coinsArr = [];
                for (var i = 0; i < 5; i++) {
                    coinsArr.push({ dx: -50 + i * 25, dy: -70 - Math.sin(i / 4 * Math.PI) * 34, taken: false });
                }
                coinSets.push({ x: lastX - SEG / 2, list: coinsArr });
            }
            // pennant bunting strung across the slope
            if (lastX > 500 && Math.random() < 0.14) {
                buntings.push({ x: lastX - SEG / 2 });
            }
        }
        // prune far behind
        while (heights.length && heights[0].x < camX - SEG * 3) heights.shift();
        chasms = chasms.filter(function (c) { return c.x0 + c.w > camX - 100; });
        rocks = rocks.filter(function (r) { return r.x > camX - 100; });
        cacti = cacti.filter(function (c) { return c.x > camX - 100; });
        birds = birds.filter(function (b) { return b.x > camX - 100; });
        coinSets = coinSets.filter(function (c) { return c.x > camX - 200; });
        buntings = buntings.filter(function (b) { return b.x > camX - 200; });
    }

    function segAt(x) {
        for (var i = 0; i < heights.length - 1; i++) {
            if (x >= heights[i].x && x <= heights[i + 1].x) return i;
        }
        return heights.length - 2;
    }

    function inChasm(x) {
        for (var i = 0; i < chasms.length; i++) {
            if (x >= chasms[i].x0 && x <= chasms[i].x0 + chasms[i].w) return true;
        }
        return false;
    }

    function groundAt(x) {
        if (inChasm(x)) return null;
        var i = segAt(x);
        var a = heights[i], b = heights[i + 1];
        var f = (x - a.x) / (b.x - a.x || 1);
        var s = (1 - Math.cos(f * Math.PI)) / 2;
        return a.h + (b.h - a.h) * s;
    }

    function slopeAt(x) {
        var h0 = groundAt(x - 6), h1 = groundAt(x + 6);
        if (h0 === null || h1 === null) return 0;
        return Math.atan2(h1 - h0, 12) * 180 / Math.PI;
    }

    function endGame(why) {
        over = true;
        var pts = Math.floor(dist / 50) + coins * 10 + bonus;
        var res = Arcade.scores.submit('dune-surf', pts);
        loop.pause();
        Arcade.ui.gameOver({
            title: 'DUNE SURF',
            label: why,
            score: pts + ' pts',
            best: res.best, isNew: res.isNew,
            onReplay: function () { reset(); loop.resume(); }
        });
    }

    function crash(why) {
        Arcade.audio.play('boom');
        Arcade.haptics.buzz('error');
        endGame(why);
    }

    /* ── input: hold to jump / flip ─────────────────────────────── */
    function press(e) {
        if (e) e.preventDefault();
        if (over || holding) return;
        holding = true;
        holdT = 0;
        if (grounded) {
            grounded = false;
            rideVY = -540;
            flips = 0;
            flipBase = rot;
            Arcade.audio.play('flap');
        }
    }
    function release() { holding = false; }
    canvas.addEventListener('pointerdown', press);
    window.addEventListener('pointerup', release);
    window.addEventListener('pointercancel', release);
    document.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); press(); }
    });
    document.addEventListener('keyup', function (e) {
        if (e.key === ' ' || e.key === 'ArrowUp') release();
    });

    function normDeg(d) {
        d = ((d % 360) + 360) % 360;
        return d > 180 ? d - 360 : d;
    }

    function update(dt) {
        if (over) return;
        t += dt;
        // the stage box grows after first layout (bar + safe areas);
        // rescale stored heights so the slope keeps its proportions
        if (view.h !== hBase) {
            var f = view.h / hBase;
            for (var hi = 0; hi < heights.length; hi++) heights[hi].h *= f;
            if (!grounded) rideY *= f;
            hBase = view.h;
        }
        runSpeed = Math.min(360, runSpeed + dt * 3.4);
        rideX += runSpeed * dt;
        dist = rideX;
        camX = rideX - view.w * 0.35;
        ensureAhead(camX + view.w * 1.6);

        if (holding) holdT += dt;

        if (!grounded) {
            // floaty glide: holding early softens gravity instead of adding a
            // hard pop, so the arc reads as carving through air
            var g = GRAV;
            if (holding && holdT < 0.35) g *= 0.62;
            rideVY += g * dt;
            rideY += rideVY * dt;
            // holding in the air rotates into a backflip
            if (holding) {
                rot -= 360 * dt;
                var turned = Math.abs(normDeg(rot - flipBase));
                if (turned > 300 && flips === 0) {
                    flips = 1;
                    bonus += 100;
                    Arcade.audio.play('coinup');
                    Arcade.haptics.buzz('light');
                }
            }
            var gg = groundAt(rideX);
            if (gg !== null && rideY >= gg - 6 && rideVY > 0) {
                var sl = slopeAt(rideX);
                var off = Math.abs(normDeg(rot) - sl);
                if (off > 90) { crash('Bad landing'); return; }
                rideY = gg - 6;
                // soft landing: shed a little speed instead of a hard stop
                rideVY = 0;
                grounded = true;
                rot = sl;
                slopeDeg = sl;
                if (flips > 0) Arcade.audio.play('clear');
            } else if (rideY > view.h + 240) {
                crash('Swallowed by the crevasse');
                return;
            }
        } else {
            var gg2 = groundAt(rideX);
            if (gg2 === null) {
                grounded = false;   // rode off a crevasse edge
            } else {
                // smooth slope follow: ease toward the surface
                var target = gg2 - 6;
                rideY += (target - rideY) * Math.min(1, dt * 18);
                slopeDeg = slopeAt(rideX);
                rot = slopeDeg;
            }
        }

        // rocks + cacti
        for (var i = 0; i < rocks.length; i++) {
            var rk = rocks[i];
            var gy = groundAt(rk.x);
            if (gy === null) continue;
            if (Math.hypot(rk.x - rideX, (gy - rk.r) - (rideY - 8)) < rk.r + 12) {
                crash('Clipped a rock');
                return;
            }
        }
        for (var c2 = 0; c2 < cacti.length; c2++) {
            var ct = cacti[c2];
            var cgy = groundAt(ct.x);
            if (cgy === null) continue;
            if (Math.hypot(ct.x - rideX, (cgy - ct.h * 0.6) - (rideY - 8)) < ct.h * 0.6 + 12) {
                crash('Cactus!');
                return;
            }
        }
        // birds: level fliers at head height — jump only when clear
        for (var b2 = 0; b2 < birds.length; b2++) {
            var bd = birds[b2];
            bd.x -= runSpeed * 0.12 * dt;   // drift toward the rider
            bd.fl += dt * 6;
            if (bd.taken) continue;
            if (Math.hypot(bd.x - rideX, bd.y - (rideY - 12)) < 20) {
                crash('Hit a bird');
                return;
            }
        }

        // coins
        for (var c = 0; c < coinSets.length; c++) {
            var cs = coinSets[c];
            for (var k = 0; k < cs.list.length; k++) {
                var cn = cs.list[k];
                if (cn.taken) continue;
                if (Math.hypot(cs.x + cn.dx - rideX, groundAt(cs.x) + cn.dy - rideY) < 24) {
                    cn.taken = true;
                    coins++;
                    Arcade.audio.play('coin');
                    Arcade.haptics.buzz('light');
                }
            }
        }

        Arcade.ui.setScore(String(Math.floor(dist / 50) + coins * 10 + bonus).padStart(3, '0'));
    }

    function render() {
        var p = Arcade.palette();
        var ctx = view.ctx;

        // sunset sky
        var sky = ctx.createLinearGradient(0, 0, 0, view.h);
        sky.addColorStop(0, '#241242');
        sky.addColorStop(0.15, '#5A2350');
        sky.addColorStop(0.30, '#A8434A');
        sky.addColorStop(0.42, '#E07B44');
        sky.addColorStop(0.5, '#F0B45C');
        sky.addColorStop(1, '#F0B45C');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, view.w, view.h);

        // setting sun near the horizon
        var sunX = view.w * 0.72, sunY = view.h * 0.22;
        ctx.fillStyle = 'rgba(255,213,51,0.25)';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 46, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFD533';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 30, 0, Math.PI * 2);
        ctx.fill();

        // receding parallax layers: mesas, then dunes getting nearer/darker
        function layer(f, base, amp, col, capCol, seed) {
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.moveTo(0, view.h);
            for (var x = 0; x <= view.w; x += 12) {
                var wx = camX * f + x + seed;
                var y = view.h * base + Math.sin(wx / 150) * amp + Math.sin(wx / 53) * (amp * 0.35);
                ctx.lineTo(x, y);
            }
            ctx.lineTo(view.w, view.h);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = capCol;
            ctx.beginPath();
            ctx.moveTo(0, view.h);
            for (var x2 = 0; x2 <= view.w; x2 += 12) {
                var wx2 = camX * f + x2 + seed;
                var y2 = view.h * base + Math.sin(wx2 / 150) * amp + Math.sin(wx2 / 53) * (amp * 0.35);
                ctx.lineTo(x2, y2 - amp * 0.28);
            }
            ctx.lineTo(view.w, view.h);
            ctx.closePath();
            ctx.fill();
        }
        var la = view.h * 0.06;
        layer(0.08, 0.30, la * 0.8, '#3A2560', 'rgba(255,190,150,0.24)', 0);    // far mesas
        layer(0.16, 0.38, la * 1.0, '#452855', 'rgba(255,175,140,0.20)', 140);  // mid dunes
        layer(0.30, 0.46, la * 1.2, '#522A4C', 'rgba(255,160,120,0.16)', 300);  // near dunes
        layer(0.48, 0.54, la * 1.4, '#3F2140', 'rgba(255,150,110,0.12)', 520);  // nearest band

        function sx(x) { return x - camX; }

        // bunting strings
        for (var bi = 0; bi < buntings.length; bi++) {
            var b = buntings[bi];
            var g0 = groundAt(b.x - 70), g1 = groundAt(b.x + 70);
            if (g0 === null || g1 === null) continue;
            var y0 = g0 - 120, y1 = g1 - 120;
            ctx.strokeStyle = 'rgba(234,242,255,0.5)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(sx(b.x - 70), y0);
            ctx.quadraticCurveTo(sx(b.x), Math.max(y0, y1) + 26, sx(b.x + 70), y1);
            ctx.stroke();
            for (var fi = 1; fi < 7; fi++) {
                var fx = b.x - 70 + fi * 20;
                var ft = fi / 7;
                var fy = (1 - ft) * (1 - ft) * y0 + 2 * (1 - ft) * ft * (Math.max(y0, y1) + 26) + ft * ft * y1;
                ctx.fillStyle = ['#FF4B5C', '#FFD533', '#19C6FF', '#8EFF2A'][fi % 4];
                ctx.beginPath();
                ctx.moveTo(sx(fx) - 5, fy);
                ctx.lineTo(sx(fx) + 5, fy);
                ctx.lineTo(sx(fx), fy + 9);
                ctx.closePath();
                ctx.fill();
            }
        }

        // terrain: one filled run per unbroken stretch of ground, so
        // crevasses stay open to the sky
        var run = [];
        function flushRun() {
            if (run.length > 1) {
                ctx.beginPath();
                ctx.moveTo(run[0][0], run[0][1]);
                for (var q = 1; q < run.length; q++) ctx.lineTo(run[q][0], run[q][1]);
                ctx.strokeStyle = '#F0C98A';
                ctx.lineWidth = 7;
                ctx.stroke();
                ctx.lineTo(run[run.length - 1][0], view.h + 40);
                ctx.lineTo(run[0][0], view.h + 40);
                ctx.closePath();
                var tgrad = ctx.createLinearGradient(0, view.h * 0.5, 0, view.h);
                tgrad.addColorStop(0, '#3A3350');
                tgrad.addColorStop(1, '#221F30');
                ctx.fillStyle = tgrad;
                ctx.fill();
            }
            run = [];
        }
        for (var x = camX - 20; x <= camX + view.w + 20; x += 8) {
            if (inChasm(x)) { flushRun(); continue; }
            var y = groundAt(x);
            if (y === null) { flushRun(); continue; }
            run.push([sx(x), y]);
        }
        flushRun();

        // crevasse edge caps
        for (var ci = 0; ci < chasms.length; ci++) {
            var ch = chasms[ci];
            var gl = groundAt(ch.x0 - 2), gr = groundAt(ch.x0 + ch.w + 2);
            ctx.fillStyle = '#F0C98A';
            if (gl !== null) ctx.fillRect(sx(ch.x0) - 4, gl - 4, 5, 26);
            if (gr !== null) ctx.fillRect(sx(ch.x0 + ch.w) - 1, gr - 4, 5, 26);
        }

        // rocks
        for (var i = 0; i < rocks.length; i++) {
            var rk = rocks[i];
            var rgy = groundAt(rk.x);
            if (rgy === null) continue;
            ctx.fillStyle = '#4A5266';
            ctx.beginPath();
            ctx.arc(sx(rk.x), rgy - rk.r + 4, rk.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(sx(rk.x) - rk.r * 0.3, rgy - rk.r * 1.2, rk.r * 0.35, 0, Math.PI * 2);
            ctx.fill();
        }

        // cacti
        for (var c3 = 0; c3 < cacti.length; c3++) {
            var ct = cacti[c3];
            var cgy = groundAt(ct.x);
            if (cgy === null) continue;
            var cx = sx(ct.x);
            ctx.fillStyle = '#2F8F3E';
            ctx.fillRect(cx - 5, cgy - ct.h, 10, ct.h);
            ctx.fillRect(cx - 14, cgy - ct.h * 0.8, 10, 6);
            ctx.fillRect(cx - 14, cgy - ct.h * 0.8, 6, 18);
            ctx.fillRect(cx + 4, cgy - ct.h * 0.6, 10, 6);
            ctx.fillRect(cx + 8, cgy - ct.h * 0.6, 6, 16);
            ctx.fillStyle = 'rgba(0,0,0,0.22)';
            ctx.fillRect(cx - 5, cgy - 3, 10, 3);
        }

        // birds
        for (var b3 = 0; b3 < birds.length; b3++) {
            var bd = birds[b3];
            var bxp = sx(bd.x);
            if (bxp < -40 || bxp > view.w + 40) continue;
            var flap = Math.sin(bd.fl) * 5;
            ctx.strokeStyle = '#1B1035';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(bxp - 9, bd.y - flap);
            ctx.lineTo(bxp, bd.y);
            ctx.lineTo(bxp + 9, bd.y - flap);
            ctx.stroke();
        }

        // coins
        for (var c = 0; c < coinSets.length; c++) {
            var cs = coinSets[c];
            var cgy2 = groundAt(cs.x);
            if (cgy2 === null) continue;
            for (var k = 0; k < cs.list.length; k++) {
                var cn = cs.list[k];
                if (cn.taken) continue;
                ctx.fillStyle = p.neon.yellow;
                ctx.beginPath();
                ctx.arc(sx(cs.x + cn.dx), cgy2 + cn.dy, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#7A5B00';
                ctx.beginPath();
                ctx.arc(sx(cs.x + cn.dx), cgy2 + cn.dy, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // rider: a tiny dude with a red scarf on a board
        var rx = sx(rideX);
        ctx.save();
        ctx.translate(rx, rideY);
        ctx.rotate(rot * Math.PI / 180);
        ctx.scale(1.35, 1.35);
        // board
        ctx.fillStyle = '#2B2B3D';
        ctx.beginPath();
        ctx.moveTo(-18, 0);
        ctx.quadraticCurveTo(0, -6, 18, 0);
        ctx.quadraticCurveTo(0, 6, -18, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = p.accent;
        ctx.fillRect(-14, -1, 28, 2);
        // legs
        ctx.strokeStyle = '#1F2937';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-3, -1); ctx.lineTo(-5, -10);
        ctx.moveTo(4, -1); ctx.lineTo(5, -10);
        ctx.stroke();
        // torso
        ctx.fillStyle = '#2E7CD6';
        ctx.beginPath();
        ctx.ellipse(0, -15, 7, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        // arms
        ctx.strokeStyle = '#2E7CD6';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-4, -14); ctx.lineTo(-11, -16);
        ctx.moveTo(4, -14); ctx.lineTo(11, -16);
        ctx.stroke();
        // head + beanie
        ctx.fillStyle = '#F2C19B';
        ctx.beginPath();
        ctx.arc(0, -24, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = p.neon.yellow;
        ctx.beginPath();
        ctx.arc(0, -26, 5, Math.PI, 0);
        ctx.fill();
        // red scarf trailing in the wind
        ctx.strokeStyle = p.red;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-3, -20);
        ctx.quadraticCurveTo(-12, -18 + Math.sin(t * 12) * 3, -20, -12 + Math.sin(t * 12) * 2);
        ctx.stroke();
        ctx.restore();

        // distance marker
        ctx.fillStyle = 'rgba(234,242,255,0.6)';
        ctx.font = '10px ui-monospace, monospace';
        ctx.fillText(Math.floor(dist / 50) + 'm', 10, view.h - 12);
    }

    var loop = Arcade.loop({ update: update, render: render });

    Arcade.init({
        slug: 'dune-surf',
        title: 'Dune Surf',
        accent: 'orange',
        onPause: function () { loop.pause(); },
        onResume: function () { loop.resume(); }
    });

    reset();
    loop.start();
})();
</script>

</body>
</html>
