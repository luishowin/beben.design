<!DOCTYPE html>
<html lang="en" style="--accent: var(--neon-lime); --accent-glow: rgba(142,255,42,0.3)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Snake — ARCADIA</title>
    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arcadia">
    <link rel="manifest" href="/games/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/games/icons/apple-touch-icon-180.png">
    <link rel="icon" href="/games/icons/icon-192.png" type="image/png">

    <link rel="stylesheet" href="../arcade.css">
    <script src="../arcade.js"></script>
</head>
<body>

<main class="arc-stage"><canvas id="game" class="arc-surface"></canvas></main>

<script>
(function () {
    'use strict';

    var COLS = 21, ROWS = 21;
    var SPEEDS = {
        slow:   { start: 160, min: 90 },
        normal: { start: 120, min: 60 },
        fast:   { start: 85,  min: 42 }
    };
    var SPEED_KEY = 'beben-arcade-snake-speed';
    var STEP_PER_FOOD = 2;
    var GRASS_COLORS = ['#275E32', '#337040', '#3C7540'];
    var APPLE = [
        '.....SlL.',
        '....SlL..',
        '.dd.S.dd.',
        'dHHrdrrRd',
        'dHrrrrRRd',
        'drrrrRRRd',
        '.drrRRRd.',
        '.dRRRRRd.',
        '..dd.dd..'
    ];
    var APPLE_COLORS = {
        d: '#771D36', H: '#FFBC9E', r: '#FF5260', R: '#DF304E',
        S: '#E9A265', l: '#55BB45', L: '#B6EC56'
    };
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var grassTime = 0;
    var tufts = [];
    for (var y = 0; y < ROWS; y++) {
        for (var x = 0; x < COLS; x++) {
            var seed = (x * 73 + y * 139 + x * y * 47) % 101;
            if (seed < 22) {
                tufts.push({
                    x: x + 0.23 + (seed % 5) * 0.12,
                    y: y + 0.52 + (seed % 4) * 0.1,
                    height: 0.17 + (seed % 6) * 0.025,
                    color: GRASS_COLORS[seed % GRASS_COLORS.length],
                    phase: seed % 4
                });
            }
        }
    }

    var canvas = document.getElementById('game');
    var view = Arcade.fitCanvas(canvas, {
        aspect: 1, maxW: 480,
        onResize: function () { if (snake) render(); }
    });

    var snake, dir, queue, food, score, stepMs, minStep, acc, alive, speed, selEl;

    /* ── speed preference (Safari private mode throws) ────────────── */
    function readSpeed() {
        try {
            var s = localStorage.getItem(SPEED_KEY);
            return SPEEDS[s] ? s : 'normal';
        } catch (e) { return 'normal'; }
    }
    function saveSpeed(s) {
        try { localStorage.setItem(SPEED_KEY, s); } catch (e) { /* ignore */ }
    }

    function reset(s) {
        if (s) speed = s;
        var cfg = SPEEDS[speed] || SPEEDS.normal;
        var cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
        snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
        dir = { x: 1, y: 0 };
        queue = [];
        score = 0;
        stepMs = cfg.start;
        minStep = cfg.min;
        acc = 0;
        grassTime = 0;
        alive = true;
        spawnFood();
        Arcade.ui.setScore('000');
    }

    function spawnFood() {
        var free = [];
        for (var y = 0; y < ROWS; y++) {
            for (var x = 0; x < COLS; x++) {
                var taken = snake.some(function (s) { return s.x === x && s.y === y; });
                if (!taken) free.push({ x: x, y: y });
            }
        }
        food = free[Math.floor(Math.random() * free.length)];
    }

    function pushDir(d) {
        if (!alive || selEl) return;
        var last = queue.length ? queue[queue.length - 1] : dir;
        if (d.x === -last.x && d.y === -last.y) return;   // no 180s
        if (d.x === last.x && d.y === last.y) return;
        if (queue.length < 2) {
            queue.push(d);
            Arcade.audio.play('move');
        }
    }

    var DIRS = {
        up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
        left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
    };

    Arcade.swipe(document.body, function (d) { pushDir(DIRS[d]); });

    document.addEventListener('keydown', function (e) {
        var map = {
            ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
            w: 'up', s: 'down', a: 'left', d: 'right',
            W: 'up', S: 'down', A: 'left', D: 'right'
        };
        var d = map[e.key];
        if (d) { e.preventDefault(); pushDir(DIRS[d]); }
    });

    function tick() {
        if (queue.length) dir = queue.shift();
        var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        var hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
        var hitSelf = snake.some(function (s, i) {
            // tail cell vacates this tick unless we grow into food
            if (i === snake.length - 1 && !(head.x === food.x && head.y === food.y)) return false;
            return s.x === head.x && s.y === head.y;
        });
        if (hitWall || hitSelf) { die(); return; }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
            score++;
            stepMs = Math.max(minStep, stepMs - STEP_PER_FOOD);
            Arcade.ui.setScore(String(score).padStart(3, '0'));
            Arcade.audio.play('coin');
            Arcade.haptics.buzz('light');
            spawnFood();
        } else {
            snake.pop();
        }
    }

    function die() {
        alive = false;
        Arcade.audio.play('boom');
        Arcade.haptics.buzz('error');
        var res = Arcade.scores.submit('snake', score);
        loop.pause();
        Arcade.ui.gameOver({
            score: score, best: res.best, isNew: res.isNew,
            onReplay: function () { showSelect(); }
        });
    }

    /* ── speed picker (Slow / Normal / Fast) ──────────────────────── */
    function showSelect() {
        if (selEl) return;
        selEl = document.createElement('div');
        selEl.className = 'arc-overlay';
        var panel = document.createElement('div');
        panel.className = 'arc-panel';
        panel.style.textAlign = 'center';
        panel.innerHTML = '<div class="arc-panel-title">Snake</div>' +
            '<div class="arc-over-label">Pick your speed</div>';
        var actions = document.createElement('div');
        actions.className = 'arc-actions';
        actions.style.flexDirection = 'column';
        actions.appendChild(speedButton('Slow', 'slow'));
        actions.appendChild(speedButton('Normal', 'normal'));
        actions.appendChild(speedButton('Fast', 'fast'));
        panel.appendChild(actions);
        selEl.appendChild(panel);
        document.body.appendChild(selEl);
    }
    function speedButton(label, s) {
        var btn = document.createElement('button');
        btn.className = 'arc-action' + (s === speed ? ' arc-action--primary' : '');
        btn.textContent = label;
        btn.addEventListener('click', function () { chooseSpeed(s); });
        return btn;
    }
    function chooseSpeed(s) {
        speed = s;
        saveSpeed(s);
        Arcade.audio.play('select');
        if (selEl) { selEl.remove(); selEl = null; }
        reset(s);
        loop.resume();
    }

    function drawGrass(ctx, cell) {
        ctx.fillStyle = '#133820';
        ctx.fillRect(0, 0, view.w, view.h);

        ctx.fillStyle = '#163D23';
        for (var y = 0; y < ROWS; y++) {
            for (var x = (y % 2); x < COLS; x += 2) {
                ctx.fillRect(x * cell, y * cell, cell, cell);
            }
        }

        var wind = Math.floor(grassTime * 3);
        var blade = Math.max(1, Math.round(cell * 0.075));
        var still = reduceMotion.matches;
        tufts.forEach(function (tuft) {
            var x = Math.round(tuft.x * cell);
            var y = Math.round(tuft.y * cell);
            var h = Math.max(2, Math.round(tuft.height * cell));
            var phase = (wind + tuft.phase) % 4;
            var sway = still || phase % 2 === 0 ? 0 : (phase === 1 ? -blade : blade);
            ctx.fillStyle = tuft.color;
            ctx.fillRect(x - blade, y - blade, blade * 3, blade);
            ctx.fillRect(x - blade * 2, y - blade * 2, blade, blade);
            ctx.fillRect(x + blade * 2, y - blade * 2, blade, blade);
            ctx.fillRect(x, y - h + blade, blade, h - blade);
            ctx.fillRect(x + sway, y - h, blade, blade);
        });
    }

    function drawApple(ctx, cell) {
        var pixel = cell * 0.9 / APPLE.length;
        var left = (food.x + 0.05) * cell;
        var top = (food.y + 0.05) * cell;
        for (var y = 0; y < APPLE.length; y++) {
            for (var x = 0; x < APPLE[y].length; x++) {
                var color = APPLE_COLORS[APPLE[y][x]];
                if (!color) continue;
                var px = Math.round(left + x * pixel);
                var py = Math.round(top + y * pixel);
                ctx.fillStyle = color;
                ctx.fillRect(px, py, Math.round(left + (x + 1) * pixel) - px,
                    Math.round(top + (y + 1) * pixel) - py);
            }
        }
    }

    function drawTail(ctx, cell, color) {
        var tail = snake[snake.length - 1];
        var neighbor = snake[snake.length - 2];
        ctx.save();
        ctx.translate((tail.x + 0.5) * cell, (tail.y + 0.5) * cell);
        ctx.rotate(Math.atan2(neighbor.y - tail.y, neighbor.x - tail.x));
        ctx.scale(cell, cell);
        ctx.fillStyle = color;
        ctx.fillRect(-0.34, -0.08, 0.22, 0.16);
        ctx.fillRect(-0.12, -0.18, 0.26, 0.36);
        ctx.fillRect(0.14, -0.29, 0.36, 0.58);
        ctx.restore();
    }

    function render() {
        var p = Arcade.palette();
        var ctx = view.ctx;
        var cell = view.w / COLS;

        drawGrass(ctx, cell);
        drawApple(ctx, cell);
        drawTail(ctx, cell, p.accent);

        // snake
        ctx.fillStyle = p.accent;
        for (var i = snake.length - 2; i >= 1; i--) {
            var s = snake[i];
            var g = cell * 0.06;
            ctx.fillRect(s.x * cell + g, s.y * cell + g, cell - g * 2, cell - g * 2);
        }

        // pixel head, oriented along the direction of travel
        var h = snake[0];
        var HEAD = [
            '.DDDDD.',
            'DGGLLLD',
            'DGGLLLD',
            'DGGWWBD',
            'DGGLLLD',
            'DGGLLLD',
            '.DDDDD.'
        ];
        var hp = cell * 0.92 / 7;
        var hx = (h.x + 0.5) * cell, hy = (h.y + 0.5) * cell;
        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(Math.atan2(dir.y, dir.x));
        for (var hyy = 0; hyy < HEAD.length; hyy++) {
            for (var hxx = 0; hxx < HEAD[hyy].length; hxx++) {
                var hch = HEAD[hyy][hxx];
                if (hch === '.') continue;
                ctx.fillStyle =
                    hch === 'D' ? '#4D9E1F' :
                    hch === 'G' ? p.accent :
                    hch === 'L' ? '#C9FF8A' :
                    hch === 'W' ? '#F5F7FA' : '#0A0A12';
                ctx.fillRect((hxx - 3.5) * hp, (hyy - 3.5) * hp, hp + 0.5, hp + 0.5);
            }
        }
        ctx.restore();
    }

    var loop = Arcade.loop({
        update: function (dt) {
            if (!alive) return;
            grassTime += dt;
            acc += dt * 1000;
            while (acc >= stepMs) { acc -= stepMs; tick(); }
        },
        render: render
    });

    Arcade.init({
        slug: 'snake',
        title: 'Snake',
        accent: 'lime',
        jingles: {
            best: [[523, 0.09], [659, 0.09], [784, 0.09], [880, 0.09], [1046, 0.2]],
            over: [[330, 0.1], [294, 0.1], [262, 0.2]]
        },
        onPause: function () { loop.pause(); },
        onResume: function () { loop.resume(); }
    });

    reset(readSpeed());
    view.refit();
    loop.start();
    loop.pause();
    showSelect();
})();
</script>

</body>
</html>
