<!DOCTYPE html>
<html lang="en" style="--accent: var(--neon-lime); --accent-glow: rgba(142,255,42,0.3)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Snake — ARCADIA</title>
    <meta name="robots" content="noindex">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ARCADIA">
    <link rel="manifest" href="/games/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/games/icons/apple-touch-icon-180.png">
    <link rel="icon" href="/games/icons/icon-192.png" type="image/png">

    <link rel="stylesheet" href="../arcade.css">
    <script src="../arcade.js"></script>
</head>
<body>

<main class="arc-stage"><canvas id="game" class="arc-surface"></canvas></main>

<script>
(function () {
    'use strict';

    var COLS = 21, ROWS = 21;
    var START_STEP = 120, MIN_STEP = 60, STEP_PER_FOOD = 2;

    var canvas = document.getElementById('game');
    var view = Arcade.fitCanvas(canvas, { aspect: 1, maxW: 480 });

    var snake, dir, queue, food, score, stepMs, acc, alive;

    function reset() {
        var cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
        snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
        dir = { x: 1, y: 0 };
        queue = [];
        score = 0;
        stepMs = START_STEP;
        acc = 0;
        alive = true;
        spawnFood();
        Arcade.ui.setScore('000');
    }

    function spawnFood() {
        var free = [];
        for (var y = 0; y < ROWS; y++) {
            for (var x = 0; x < COLS; x++) {
                var taken = snake.some(function (s) { return s.x === x && s.y === y; });
                if (!taken) free.push({ x: x, y: y });
            }
        }
        food = free[Math.floor(Math.random() * free.length)];
    }

    function pushDir(d) {
        if (!alive) return;
        var last = queue.length ? queue[queue.length - 1] : dir;
        if (d.x === -last.x && d.y === -last.y) return;   // no 180s
        if (d.x === last.x && d.y === last.y) return;
        if (queue.length < 2) {
            queue.push(d);
            Arcade.audio.play('move');
        }
    }

    var DIRS = {
        up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
        left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
    };

    Arcade.swipe(document.body, function (d) { pushDir(DIRS[d]); });

    document.addEventListener('keydown', function (e) {
        var map = {
            ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
            w: 'up', s: 'down', a: 'left', d: 'right',
            W: 'up', S: 'down', A: 'left', D: 'right'
        };
        var d = map[e.key];
        if (d) { e.preventDefault(); pushDir(DIRS[d]); }
    });

    function tick() {
        if (queue.length) dir = queue.shift();
        var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        var hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
        var hitSelf = snake.some(function (s, i) {
            // tail cell vacates this tick unless we grow into food
            if (i === snake.length - 1 && !(head.x === food.x && head.y === food.y)) return false;
            return s.x === head.x && s.y === head.y;
        });
        if (hitWall || hitSelf) { die(); return; }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
            score++;
            stepMs = Math.max(MIN_STEP, stepMs - STEP_PER_FOOD);
            Arcade.ui.setScore(String(score).padStart(3, '0'));
            Arcade.audio.play('coin');
            Arcade.haptics.buzz('light');
            spawnFood();
        } else {
            snake.pop();
        }
    }

    function die() {
        alive = false;
        Arcade.audio.play('boom');
        Arcade.haptics.buzz('error');
        var res = Arcade.scores.submit('snake', score);
        loop.pause();
        Arcade.ui.gameOver({
            score: score, best: res.best, isNew: res.isNew,
            onReplay: function () { reset(); loop.resume(); }
        });
    }

    function render() {
        var p = Arcade.palette();
        var ctx = view.ctx;
        var cell = view.w / COLS;

        ctx.fillStyle = p.bgSoft;
        ctx.fillRect(0, 0, view.w, view.h);

        // checker
        ctx.fillStyle = p.gridLine;
        for (var y = 0; y < ROWS; y++) {
            for (var x = (y % 2); x < COLS; x += 2) {
                ctx.fillRect(x * cell, y * cell, cell, cell);
            }
        }

        // garden: sparse deterministic grass tufts (decorative)
        ctx.globalAlpha = 0.15;
        for (var gy = 0; gy < ROWS; gy++) {
            for (var gx = 0; gx < COLS; gx++) {
                var n = gx * 7 + gy * 13;
                if (n % 13 !== 0 && n % 37 !== 5) continue;
                var tx = (gx + 0.5) * cell, ty = (gy + 0.74) * cell;
                ctx.fillStyle = n % 37 === 5 ? '#3F8F2F' : p.accent;
                ctx.fillRect(tx - cell * 0.06, ty - cell * 0.24, cell * 0.12, cell * 0.24);
                ctx.fillRect(tx - cell * 0.2, ty - cell * 0.13, cell * 0.12, cell * 0.13);
                ctx.fillRect(tx + 0.08 * cell, ty - cell * 0.13, cell * 0.12, cell * 0.13);
            }
        }
        ctx.globalAlpha = 1;

        // food: pixel apple (red body, leaf, stem)
        var APPLE = [
            '..ss....',
            '.lls....',
            'drrrrrd.',
            'drhrhrd.',
            'drrrrrd.',
            'dRRrRRd.',
            '.ddddd..'
        ];
        var ap = cell * 0.82 / 8;
        var ax = (food.x + 0.5) * cell - ap * 4, ay = (food.y + 0.5) * cell - ap * 3.5;
        for (var ayy = 0; ayy < APPLE.length; ayy++) {
            for (var axx = 0; axx < APPLE[ayy].length; axx++) {
                var ch = APPLE[ayy][axx];
                if (ch === '.') continue;
                ctx.fillStyle =
                    ch === 'r' ? p.red :
                    ch === 'd' ? '#9E2B2B' :
                    ch === 'h' ? '#FF9B8F' :
                    ch === 'R' ? '#F27A6B' :
                    ch === 's' ? '#8A5A2B' : '#59C467';
                ctx.fillRect(ax + axx * ap, ay + ayy * ap, ap + 0.5, ap + 0.5);
            }
        }

        // snake
        for (var i = snake.length - 1; i >= 1; i--) {
            var s = snake[i];
            var g = cell * 0.06;
            ctx.fillStyle = p.accent;
            ctx.fillRect(s.x * cell + g, s.y * cell + g, cell - g * 2, cell - g * 2);
        }

        // pixel head, oriented along the direction of travel
        var h = snake[0];
        var HEAD = [
            '.DDDDD.',
            'DGGLLLD',
            'DGGLLLD',
            'DGGWWBD',
            'DGGLLLD',
            'DGGLLLD',
            '.DDDDD.'
        ];
        var hp = cell * 0.92 / 7;
        var hx = (h.x + 0.5) * cell, hy = (h.y + 0.5) * cell;
        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(Math.atan2(dir.y, dir.x));
        for (var hyy = 0; hyy < HEAD.length; hyy++) {
            for (var hxx = 0; hxx < HEAD[hyy].length; hxx++) {
                var hch = HEAD[hyy][hxx];
                if (hch === '.') continue;
                ctx.fillStyle =
                    hch === 'D' ? '#4D9E1F' :
                    hch === 'G' ? p.accent :
                    hch === 'L' ? '#C9FF8A' :
                    hch === 'W' ? '#F5F7FA' : '#0A0A12';
                ctx.fillRect((hxx - 3.5) * hp, (hyy - 3.5) * hp, hp + 0.5, hp + 0.5);
            }
        }
        ctx.restore();
    }

    var loop = Arcade.loop({
        update: function (dt) {
            if (!alive) return;
            acc += dt * 1000;
            while (acc >= stepMs) { acc -= stepMs; tick(); }
        },
        render: render
    });

    Arcade.init({
        slug: 'snake',
        title: 'Snake',
        accent: 'lime',
        jingles: {
            best: [[523, 0.09], [659, 0.09], [784, 0.09], [880, 0.09], [1046, 0.2]],
            over: [[330, 0.1], [294, 0.1], [262, 0.2]]
        },
        onPause: function () { loop.pause(); },
        onResume: function () { loop.resume(); }
    });

    reset();
    loop.start();
})();
</script>

</body>
</html>
