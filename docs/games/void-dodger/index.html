<!DOCTYPE html>
<html lang="en" style="--accent: var(--neon-blue); --accent-glow: rgba(25,198,255,0.3)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Void Dodger — ARCADIA</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ARCADIA">
    <link rel="manifest" href="/games/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/games/icons/apple-touch-icon-180.png">
    <link rel="icon" href="/games/icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="../arcade.css">
    <script src="../arcade.js"></script>
</head>
<body>

<main class="arc-stage"><canvas id="game" class="arc-surface"></canvas>
    <span class="arc-proto">Prototype &middot; full game coming soon</span>
</main>

<script>
(function () {
    'use strict';

    /* VOID DODGER (prototype)
       Steer the ship, dodge the asteroids, survive the void. */

    var LIVES = 3;

    var canvas = document.getElementById('game');
    var view = Arcade.fitCanvas(canvas, { aspect: 0.6, maxW: 420 });

    var ship, roids, stars, t, lives, spawnT, invuln, over, score;

    function reset() {
        ship = { x: null };   // null = center; view.w may grow after layout
        roids = [];
        stars = [];
        t = 0; lives = LIVES; spawnT = 0.6; invuln = 0; over = false; score = 0;
        Arcade.ui.setScore('000');
    }

    function shipX() { return ship.x === null ? view.w / 2 : ship.x; }
    function shipY() { return view.h - 60; }

    function spawnRoid() {
        var r = 8 + Math.random() * 14;
        roids.push({
            x: 20 + Math.random() * (view.w - 40),
            y: -r * 2,
            r: r,
            vy: 60 + Math.random() * 60,
            vx: (Math.random() - 0.5) * 40,
            rot: Math.random() * Math.PI * 2,
            vr: (Math.random() - 0.5) * 3,
            bumps: Math.floor(4 + Math.random() * 4)
        });
    }

    function endGame() {
        over = true;
        var pts = Math.floor(score);
        var res = Arcade.scores.submit('void-dodger', pts);
        loop.pause();
        Arcade.ui.gameOver({
            title: 'VOID DODGER',
            score: pts + ' pts',
            best: res.best, isNew: res.isNew,
            onReplay: function () { reset(); loop.resume(); }
        });
    }

    function hit() {
        lives--;
        invuln = 2;
        Arcade.audio.play('boom');
        Arcade.haptics.buzz('error');
        if (lives <= 0) endGame();
    }

    canvas.addEventListener('pointermove', function (e) {
        var r = canvas.getBoundingClientRect();
        ship.x = (e.clientX - r.left) / r.width * view.w;
    });
    canvas.addEventListener('pointerdown', function (e) {
        var r = canvas.getBoundingClientRect();
        ship.x = (e.clientX - r.left) / r.width * view.w;
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') ship.x -= 18;
        if (e.key === 'ArrowRight') ship.x += 18;
        ship.x = Math.max(14, Math.min(view.w - 14, ship.x));
    });

    function render() {
        var p = Arcade.palette();
        var ctx = view.ctx;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, view.w, view.h);

        // starfield
        if (stars.length < 40 && Math.random() < 0.3) {
            stars.push({ x: Math.random() * view.w, y: Math.random() * view.h, s: Math.random() * 1.5 + 0.5 });
        }
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            ctx.globalAlpha = 0.3 + 0.7 * (s.s / 2);
            ctx.fillRect(s.x, s.y, s.s, s.s);
        }
        ctx.globalAlpha = 1;

        // asteroids
        for (var i = 0; i < roids.length; i++) {
            var a = roids[i];
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.rot);
            ctx.beginPath();
            for (var b = 0; b < a.bumps; b++) {
                var ang = (b / a.bumps) * Math.PI * 2;
                var rr = a.r * (b % 2 ? 0.75 : 1);
                var px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
                if (b === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = '#20242F';
            ctx.fill();
            ctx.strokeStyle = p.muted;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();
        }

        // ship
        var blink = invuln > 0 && Math.floor(invuln * 8) % 2 === 0;
        if (!blink) {
            var sx = shipX(), sy = shipY();
            ctx.fillStyle = p.accent;
            ctx.beginPath();
            ctx.moveTo(sx, sy - 12);
            ctx.lineTo(sx - 9, sy + 10);
            ctx.lineTo(sx, sy + 5);
            ctx.lineTo(sx + 9, sy + 10);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = p.headers;
            ctx.fillRect(sx - 2.5, sy - 4, 5, 8);
        }

        // lives
        ctx.fillStyle = p.accent;
        for (var i = 0; i < lives; i++) ctx.fillRect(10 + i * 14, 10, 8, 8);
    }

    var loop = Arcade.loop({
        update: function (dt) {
            if (over) return;
            t += dt;
            score += dt * 10;
            invuln = Math.max(0, invuln - dt);

            for (var i = 0; i < stars.length; i++) {
                stars[i].y += stars[i].s * 22 * dt;
                if (stars[i].y > view.h) { stars[i].y = -2; stars[i].x = Math.random() * view.w; }
            }

            spawnT -= dt * (1 + t / 60);
            if (spawnT <= 0) { spawnRoid(); spawnT = Math.max(0.22, 0.55 - t / 90); }

            for (var i = roids.length - 1; i >= 0; i--) {
                var a = roids[i];
                a.y += a.vy * dt * (1 + t / 75);
                a.x += a.vx * dt;
                a.rot += a.vr * dt;
                if (a.x < a.r) { a.x = a.r; a.vx *= -1; }
                if (a.x > view.w - a.r) { a.x = view.w - a.r; a.vx *= -1; }
                if (a.y > view.h + a.r * 2) { roids.splice(i, 1); continue; }
                var dx = a.x - shipX(), dy = a.y - shipY();
                var rr = a.r + 10 - 3;
                if (dx * dx + dy * dy < rr * rr) {
                    roids.splice(i, 1);
                    if (invuln <= 0) hit();
                }
            }

            Arcade.ui.setScore(String(Math.floor(score)).padStart(3, '0'));
        },
        render: render
    });

    Arcade.init({
        title: 'Void Dodger',
        accent: 'blue',
        onPause: function () { loop.pause(); },
        onResume: function () { loop.resume(); }
    });

    reset();
    loop.start();
})();
</script>

</body>
</html>
