<!DOCTYPE html>
<html lang="en" style="--accent: var(--neon-red); --accent-glow: rgba(255,75,92,0.3)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Checkers — ARCADIA</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ARCADIA">
    <link rel="manifest" href="/games/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/games/icons/apple-touch-icon-180.png">
    <link rel="icon" href="/games/icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="../arcade.css">
    <script src="../arcade.js"></script>
    <style>
        /* live turn indicator, tucked under the board; the stage keeps a band
           reserved for it so the text never lands on the bottom row */
        .arc-stage { padding-bottom: calc(1.9rem + env(safe-area-inset-bottom)); }
        .arc-status {
            position: absolute;
            bottom: 0.55rem;
            left: 0;
            right: 0;
            z-index: 5;
            text-align: center;
            font-size: 0.6rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-muted);
            pointer-events: none;
            white-space: nowrap;
        }
        .arc-status--red { color: var(--neon-red); }
        .arc-status--light { color: #EAF2FF; }
    </style>
</head>
<body>

<main class="arc-stage"><canvas id="game" class="arc-surface"></canvas>
    <span class="arc-proto">Beta</span>
    <span class="arc-status" id="status" role="status" aria-live="polite"></span>
</main>

<script>
(function () {
    'use strict';

    /* CHECKERS
       Red discs hold the bottom three rows and climb the board; light
       comes down from the top. 1 Player: race the simple AI.
       2 Players: hot-seat, both sides on this device. */

    var N = 8;
    var MODE_KEY = 'beben-arcade-checkers-mode';

    var canvas = document.getElementById('game');
    var view = Arcade.fitCanvas(canvas, { aspect: 1, maxW: 480 });
    var statusEl = document.getElementById('status');

    var board, mode, turn, sel, moves, caps, over, aiTimer, selEl;

    /* ── mode preference (Safari private mode throws) ────────────── */
    function readMode() {
        try { return localStorage.getItem(MODE_KEY) === '2p' ? '2p' : 'cpu'; }
        catch (e) { return 'cpu'; }
    }
    function saveMode(m) {
        try { localStorage.setItem(MODE_KEY, m); } catch (e) { /* ignore */ }
    }

    function reset(m) {
        if (m) mode = m;
        board = [];
        for (var y = 0; y < N; y++) {
            board[y] = [];
            for (var x = 0; x < N; x++) {
                board[y][x] = 0;
                if ((x + y) % 2 === 1) {
                    if (y > 4) board[y][x] = 1;        // red — you / P1, bottom rows
                    if (y < 3) board[y][x] = -1;       // light — AI / P2, top rows
                }
            }
        }
        turn = 1;                                      // red opens
        sel = null;
        moves = [];
        caps = { red: 0, light: 0 };
        over = false;
        clearTimeout(aiTimer);
        updateHud();
    }

    function inside(x, y) { return x >= 0 && y >= 0 && x < N && y < N; }

    function movesFor(x, y) {
        var p = board[y][x];
        if (!p) return { steps: [], jumps: [] };
        var steps = [], jumps = [];
        var dy = p > 0 ? -1 : 1;                       // red climbs, light descends
        var dirs = Math.abs(p) === 2 ? [dy, -dy] : [dy];
        for (var i = 0; i < dirs.length; i++) {
            var d = dirs[i];
            for (var dx = -1; dx <= 1; dx += 2) {
                var nx = x + dx, ny = y + d;
                if (inside(nx, ny) && board[ny][nx] === 0) steps.push({ x: nx, y: ny });
                var jx = x + dx * 2, jy = y + d * 2;
                if (inside(jx, jy) && board[jy][jx] === 0 &&
                    inside(nx, ny) && board[ny][nx] && Math.sign(board[ny][nx]) !== Math.sign(p)) {
                    jumps.push({ x: jx, y: jy, via: { x: nx, y: ny } });
                }
            }
        }
        return { steps: steps, jumps: jumps };
    }

    function allMovesFor(sign) {
        var list = [];
        for (var y = 0; y < N; y++)
            for (var x = 0; x < N; x++) {
                if (Math.sign(board[y][x]) !== sign) continue;
                var m = movesFor(x, y);
                if (m.jumps.length) list.push({ from: { x: x, y: y }, to: m.jumps });
                else if (m.steps.length) list.push({ from: { x: x, y: y }, to: m.steps });
            }
        return list;
    }

    function applyMove(from, to, via) {
        var p = board[from.y][from.x];
        board[to.y][to.x] = p;
        board[from.y][from.x] = 0;
        if (via) board[via.y][via.x] = 0;
        // crowned on the far rank: red on top, light on the bottom
        if (p === 1 && to.y === 0) board[to.y][to.x] = 2;
        if (p === -1 && to.y === N - 1) board[to.y][to.x] = -2;
    }

    function updateHud() {
        if (mode === '2p') Arcade.ui.setScore(caps.red + ' : ' + caps.light);
        else Arcade.ui.setScore(String(caps.red).padStart(3, '0'));
        if (statusEl) {
            var txt, cls;
            if (mode === '2p') {
                txt = turn > 0 ? 'Red to move' : 'Light to move';
                cls = turn > 0 ? 'arc-status--red' : 'arc-status--light';
            } else {
                txt = turn > 0 ? 'Your move' : 'CPU thinking';
                cls = turn > 0 ? 'arc-status--red' : 'arc-status--light';
            }
            statusEl.textContent = txt;
            statusEl.className = 'arc-status ' + cls;
        }
    }

    function endGame(winner) {                          // winner: 1 red, -1 light
        over = true;
        clearTimeout(aiTimer);
        var opts = { onReplay: showSelect };
        if (mode === '2p') {
            Arcade.audio.play('fanfare');
            opts.title = winner > 0 ? 'RED WINS' : 'LIGHT WINS';
            opts.label = 'Pieces captured — red : light';
            opts.score = caps.red + ' : ' + caps.light;
            opts.best = null;
            opts.isNew = false;
        } else {
            var playerWon = winner > 0;
            var res = Arcade.scores.submit('checkers', caps.red);
            Arcade.audio.play(playerWon ? 'fanfare' : 'boom');
            opts.title = playerWon ? 'YOU WIN' : 'AI WINS';
            opts.label = 'Pieces captured';
            opts.score = caps.red;
            opts.best = res.best;
            opts.isNew = res.isNew;
        }
        Arcade.ui.gameOver(opts);
    }

    function afterMove(sign) {
        var opp = -sign;
        if (!allMovesFor(opp).length) { endGame(sign); return; }
        turn = opp;
        updateHud();
        if (mode === 'cpu' && turn < 0) aiTimer = setTimeout(aiMove, 550);
    }

    function aiMove() {
        if (over || mode !== 'cpu' || turn > 0) return;
        var list = allMovesFor(-1);
        if (!list.length) { endGame(1); return; }
        // prefer jumps, else random
        var withJumps = list.filter(function (m) { return m.from && movesFor(m.from.x, m.from.y).jumps.length; });
        var pool = withJumps.length ? withJumps : list;
        var pick = pool[Math.floor(Math.random() * pool.length)];
        var to = pick.to[Math.floor(Math.random() * pick.to.length)];
        applyMove(pick.from, to, to.via || null);
        Arcade.audio.play('bounce');
        afterMove(-1);
    }

    function playerMove(from, to) {
        var p = board[from.y][from.x];
        var via = to.via || null;
        if (via) {
            if (p > 0) caps.red++; else caps.light++;
            Arcade.audio.play('merge');
            Arcade.haptics.buzz('medium');
        } else {
            Arcade.audio.play('bounce');
        }
        applyMove(from, to, via);
        sel = null;
        moves = [];
        afterMove(p > 0 ? 1 : -1);
    }

    function cellAt(e) {
        var r = canvas.getBoundingClientRect();
        var cx = (e.clientX - r.left) / r.width * view.w;
        var cy = (e.clientY - r.top) / r.height * view.h;
        return { x: Math.floor(cx / (view.w / N)), y: Math.floor(cy / (view.h / N)) };
    }

    canvas.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (over || selEl) return;                     // game over, or mode picker open
        if (mode === 'cpu' && turn < 0) return;        // CPU is moving
        var c = cellAt(e);
        if (sel && sel.x === c.x && sel.y === c.y) { sel = null; moves = []; return; }
        // click a highlighted target?
        for (var i = 0; i < moves.length; i++) {
            if (moves[i].x === c.x && moves[i].y === c.y) {
                playerMove(sel, moves[i]);
                return;
            }
        }
        // select a piece of the side to move
        var sign = Math.sign(board[c.y][c.x]);
        if (sign === turn) {
            var mf = movesFor(c.x, c.y);
            var opts = mf.jumps.length ? mf.jumps : mf.steps;
            if (opts.length) {
                sel = { x: c.x, y: c.y };
                moves = opts;
                Arcade.audio.play('tap');
            }
        } else {
            if (sign) Arcade.audio.play('denied');     // the other side's piece
            sel = null; moves = [];
        }
    });

    /* ── mode picker (1 player vs CPU / 2 players hot-seat) ──────── */
    function showSelect() {
        clearTimeout(aiTimer);
        if (statusEl) statusEl.textContent = '';
        if (selEl) return;
        selEl = document.createElement('div');
        selEl.className = 'arc-overlay';
        var panel = document.createElement('div');
        panel.className = 'arc-panel';
        panel.style.textAlign = 'center';
        panel.innerHTML = '<div class="arc-panel-title">Checkers</div>' +
            '<div class="arc-over-label">Capture every piece<br>or block every move</div>';
        var actions = document.createElement('div');
        actions.className = 'arc-actions';
        actions.style.flexDirection = 'column';
        actions.appendChild(modeButton('1 Player', 'cpu'));
        actions.appendChild(modeButton('2 Players', '2p'));
        panel.appendChild(actions);
        selEl.appendChild(panel);
        document.body.appendChild(selEl);
    }
    function modeButton(label, m) {
        var btn = document.createElement('button');
        btn.className = 'arc-action' + (m === mode ? ' arc-action--primary' : '');
        btn.textContent = label;
        btn.addEventListener('click', function () { chooseMode(m); });
        return btn;
    }
    function chooseMode(m) {
        mode = m;
        saveMode(m);
        Arcade.audio.play('select');
        if (selEl) { selEl.remove(); selEl = null; }
        reset(m);
    }

    function render() {
        var p = Arcade.palette();
        var ctx = view.ctx;
        var cell = view.w / N;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, view.w, view.h);

        for (var y = 0; y < N; y++) {
            for (var x = 0; x < N; x++) {
                ctx.fillStyle = (x + y) % 2 === 1 ? '#1E2540' : '#0B0E1E';
                ctx.fillRect(x * cell, y * cell, cell, cell);
            }
        }

        // selection + target highlights
        if (sel) {
            ctx.fillStyle = 'rgba(255,213,51,0.3)';
            ctx.fillRect(sel.x * cell, sel.y * cell, cell, cell);
            for (var i = 0; i < moves.length; i++) {
                var m = moves[i];
                ctx.fillStyle = m.via ? 'rgba(255,75,92,0.35)' : 'rgba(142,255,42,0.25)';
                ctx.fillRect(m.x * cell, m.y * cell, cell, cell);
            }
        }

        // pieces
        for (var y = 0; y < N; y++) {
            for (var x = 0; x < N; x++) {
                var v = board[y][x];
                if (!v) continue;
                var cx = (x + 0.5) * cell, cy = (y + 0.5) * cell;
                ctx.beginPath();
                ctx.arc(cx, cy, cell * 0.38, 0, Math.PI * 2);
                ctx.fillStyle = v > 0 ? p.red : '#EAF2FF';
                ctx.fill();
                ctx.strokeStyle = v > 0 ? '#7A1626' : '#6A7084';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, cell * 0.26, 0, Math.PI * 2);
                ctx.strokeStyle = v > 0 ? 'rgba(0,0,0,0.3)' : 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                if (Math.abs(v) === 2) {
                    ctx.fillStyle = v > 0 ? '#FFD533' : '#8B5CFF';
                    ctx.beginPath();
                    ctx.moveTo(cx - cell * 0.14, cy + cell * 0.1);
                    ctx.lineTo(cx - cell * 0.1, cy - cell * 0.12);
                    ctx.lineTo(cx, cy + cell * 0.04);
                    ctx.lineTo(cx + cell * 0.1, cy - cell * 0.12);
                    ctx.lineTo(cx + cell * 0.14, cy + cell * 0.1);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }
    }

    var loop = Arcade.loop({ update: function () {}, render: render });

    Arcade.init({
        title: 'Checkers',
        accent: 'red',
        onPause: function () { loop.pause(); },
        onResume: function () { loop.resume(); }
    });

    reset(readMode());
    loop.start();
    showSelect();
})();
</script>

</body>
</html>
