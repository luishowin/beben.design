<!DOCTYPE html>
<html lang="en" style="--accent: var(--neon-yellow); --accent-glow: rgba(255,213,51,0.3)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Five Letter — ARCADIA</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arcadia">
    <link rel="manifest" href="/games/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/games/icons/apple-touch-icon-180.png">
    <link rel="icon" href="/games/icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="../arcade.css">
    <script src="../arcade.js"></script>
    <style>
        .cw {
            width: min(440px, 96vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.55rem;
            user-select: none;
        }
        .cw-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }
        .cw-cell {
            position: relative;
            width: 58px;
            height: 58px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-pixel);
            font-size: 1rem;
            text-transform: uppercase;
        }
        .cw-cell--block { background: #05060F; }
        .cw-cell--open {
            background: #EAF2FF;
            color: #12162A;
            border: 1px solid #9FB0C8;
        }
        .cw-cell--word { background: #CDE6FF; }
        .cw-cell--active { box-shadow: inset 0 0 0 3px var(--accent); }
        .cw-cell--done { background: #BEE6C0; }
        .cw-cell--glow { animation: cw-glow 1.1s ease; }
        @keyframes cw-glow {
            0% { background: #538D4E; color: #fff; }
            100% { background: #BEE6C0; color: #12162A; }
        }
        .cw-num {
            position: absolute;
            top: 1px;
            left: 3px;
            font-family: var(--font-mono);
            font-size: 0.5rem;
            font-weight: 700;
            color: #5A6B85;
        }
        .cw-clues {
            width: 100%;
            max-height: 32vh;
            overflow-y: auto;
            overscroll-behavior: contain;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.15rem 1rem;
            font-size: 0.72rem;
            line-height: 1.4;
        }
        .cw-clue {
            display: flex;
            gap: 0.4rem;
            color: var(--text-muted);
            padding: 0.12rem 0.2rem;
            border-radius: 3px;
            cursor: pointer;
        }
        .cw-clue--active { color: var(--headers); background: rgba(255, 213, 51, 0.12); }
        .cw-clue b { color: var(--accent); font-weight: 700; flex: none; }
        .cw-head {
            grid-column: 1 / -1;
            font-family: var(--font-pixel);
            font-size: 0.5rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }
        .cw-note {
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .wl-keys { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .wl-krow { display: flex; gap: 5px; justify-content: center; }
        .wl-key {
            flex: 1 1 0;
            max-width: 44px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--headers);
            background: #3A3A4C;
            border-radius: 4px;
        }
        .wl-key:active { transform: translateY(1px); }
        .wl-key--wide { max-width: 60px; font-size: 0.8rem; }
        @media (max-height: 720px) {
            .cw-cell { width: 48px; height: 48px; font-size: 0.85rem; }
            .wl-key { height: 42px; }
        }
    </style>
</head>
<body>

<main class="arc-stage">
    <span class="arc-proto">Beta</span>
    <div class="cw">
        <div class="cw-board" id="board"></div>
        <div class="cw-clues" id="clues"></div>
        <div class="wl-keys" id="keys"></div>
        <div class="cw-note">All clues in UK English.</div>
    </div>
</main>

<script>
(function () {
    'use strict';

    /* FIVE LETTER
       A newspaper mini crossword. Read the clues, fill the grid with the
       on-screen (or physical) keyboard. A row or column glows green when
       its word is correct. Solve them all for the next puzzle. */

    var STREAK_KEY = 'beben-arcade-five-letter-streak';
    var ROWS = 5, COLS = 5;

    var PUZZLES = [
        { grid: ['#vat#', 'salad', 'alike', 'given', '#den#'], clues: {
            '1A': 'Value added tax', '1D': 'Legally acceptable', '2D': 'Not dead',
            '3D': 'Already claimed', '4A': 'Bowl of raw greens', '4D': 'Droop in the middle',
            '5D': 'Cosy room', '6A': 'Similar in kind', '7A': 'Already assumed', '8A': "Bear's lair" } },
        { grid: ['#sap#', 'straw', 'arise', 'taste', '#yea#'], clues: {
            '1A': 'Tree fluid', '1D': 'Wander off', '2D': 'Get out of bed',
            '3D': 'Spaghetti, e.g.', '4A': 'Drinking tube', '4D': 'Took a chair',
            '5D': 'Tiny', '6A': 'Come up', '7A': 'Sample a flavour', '8A': 'Old-time yes' } },
        { grid: ['#sap#', 'straw', 'arise', 'waste', '#yea#'], clues: {
            '1A': 'Tree fluid', '1D': 'Wander off', '2D': 'Get out of bed',
            '3D': 'Spaghetti, e.g.', '4A': 'Drinking tube', '4D': 'Cutting tool',
            '5D': 'Tiny', '6A': 'Come up', '7A': 'Throw away', '8A': 'Old-time yes' } },
        { grid: ['#tar#', 'throw', 'argue', 'bound', '#wed#'], clues: {
            '1A': 'Road goo', '1D': 'Toss', '2D': 'Bicker', '3D': 'Circular',
            '4A': 'Toss', '4D': 'Bar bill', '5D': 'Marry', '6A': 'Bicker',
            '7A': 'Tied up', '8A': 'Marry' } },
        { grid: ['#sag#', 'silly', 'algae', 'class', '#yes#'], clues: {
            '1A': 'Droop', '1D': 'Goofy', '2D': 'Pond scum', '3D': 'Drinking vessel',
            '4A': 'Goofy', '4D': 'Biological pouch', '5D': 'Affirmative', '6A': 'Pond scum',
            '7A': 'School period', '8A': 'Affirmative' } },
        { grid: ['#sat#', 'sorry', 'argue', 'crust', '#yet#'], clues: {
            '1A': 'Took a chair', '1D': 'Apologetic', '2D': 'Bicker', '3D': 'Rely on',
            '4A': 'Apologetic', '4D': 'Biological pouch', '5D': 'Up to now', '6A': 'Bicker',
            '7A': 'Pizza edge', '8A': 'Up to now' } },
        { grid: ['#had#', 'bones', 'alibi', 'remit', '#set#'], clues: {
            '1A': 'Past tense of have', '1D': 'Openings', '2D': 'Japanese animation',
            '3D': 'Money taken out', '4A': 'Parts of a skeleton', '4D': 'Place serving drinks',
            '5D': 'Take a seat', '6A': 'Claim of being elsewhere', '7A': 'Send money', '8A': 'Put down' } },
        { grid: ['#tea#', 'march', 'abate', 'poser', '#red#'], clues: {
            '1A': 'Hot drink made from leaves', '1D': 'Drawing of an area',
            '2D': 'Rub out', '3D': 'Colour at end of spectrum',
            '4A': 'Walk in military manner', '4D': 'Did something',
            '5D': 'Female pronoun', '6A': 'Become less intense', '7A': 'One who strikes a pose', '8A': 'Colour' } },
        { grid: ['#all#', 'their', 'means', 'saves', '#des#'], clues: {
            '1A': 'Whole amount', '1D': 'Plural of tah (tea)', '2D': 'Plural of line',
            '3D': 'Really Simple Syndication', '4A': 'Belonging to them', '4D': 'In front',
            '5D': 'Go away from', '6A': 'Way of doing something', '7A': 'Keeps safe or rescues', '8A': 'Abbreviation for desired' } },
        { grid: ['#fog#', 'river', 'inane', 'dated', '#let#'], clues: {
            '1A': 'Thick cloud of water droplets', '1D': 'Set free from',
            '2D': 'Small carnivorous mammal', '3D': 'Colour at end of spectrum',
            '4A': 'Large natural stream of water', '4D': 'Last in series',
            '5D': 'Egg-shaped', '6A': 'Empty or silly', '7A': 'Marked with date', '8A': 'Allow' } },
        { grid: ['#she#', 'awash', 'terse', 'eaten', '#ten#'], clues: {
            '1A': 'Female pronoun', '1D': 'Past tense of eat', '2D': 'Moisture from skin',
            '3D': 'Female chicken', '4A': 'Covered with water', '4D': 'Brief or concise',
            '5D': 'Past participle of eat', '6A': 'Rare steak', '7A': 'Stag', '8A': 'Number after nine' } },
        { grid: ['#age#', 'alive', 'cover', 'there', '#any#'], clues: {
            '1A': 'How old someone is', '1D': 'Tropical drink', '2D': 'Japanese animation',
            '3D': 'All of them', '4A': 'Living', '4D': 'Do something',
            '5D': 'Existing', '6A': 'Place over', '7A': 'In that place', '8A': 'Any one' } },
        { grid: ['#cap#', 'based', 'amino', 'react', '#one#'], clues: {
            '1A': 'Head covering', '1D': 'Place serving drinks', '2D': 'Asian person',
            '3D': 'Dot', '4A': 'Having a basis', '4D': 'Short for per cent',
            '5D': 'Single', '6A': 'Building block of protein', '7A': 'Act in response', '8A': 'Single' } }
    ];

    var puz, cells, entries, nums, letters, solved, glowing, active, dir, over, streak, cellEls, puzzleIdx;
    var deck = [];

    function shuffle(a) {
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
    }
    function refillDeck() {
        deck = shuffle(PUZZLES.map(function (_, i) { return i; }));
    }
    /* shuffled deck: every puzzle appears once before any repeats */
    function drawNext(exclude) {
        if (!deck.length) refillDeck();
        var idx = deck.pop();
        if (idx === exclude && deck.length && PUZZLES.length > 1) {
            deck.unshift(idx);
            idx = deck.pop();
        }
        return idx;
    }

    function readStreak() {
        try { return parseInt(localStorage.getItem(STREAK_KEY), 10) || 0; }
        catch (e) { return 0; }
    }
    function saveStreak() {
        try { localStorage.setItem(STREAK_KEY, String(streak)); } catch (e) { /* ignore */ }
    }

    function key(r, c) { return r + ',' + c; }
    function entryKey(e) { return e.n + e.dir; }

    /* derive the numbered across/down entries from the solution grid */
    function buildEntries(grid) {
        var cs = grid.map(function (row) { return row.split(''); });
        var list = [], n = 0, numbers = {};
        for (var r = 0; r < ROWS; r++) {
            for (var c = 0; c < COLS; c++) {
                if (cs[r][c] === '#') continue;
                var startsA = (c === 0 || cs[r][c - 1] === '#') && (c + 2 < COLS && cs[r][c + 1] !== '#' && cs[r][c + 2] !== '#');
                var startsD = (r === 0 || cs[r - 1][c] === '#') && (r + 2 < ROWS && cs[r + 1][c] !== '#' && cs[r + 2][c] !== '#');
                if (startsA || startsD) { n++; numbers[key(r, c)] = n; }
                if (startsA) {
                    var la = 0; while (c + la < COLS && cs[r][c + la] !== '#') la++;
                    list.push({ n: n, dir: 'A', r: r, c: c, len: la });
                }
                if (startsD) {
                    var ld = 0; while (r + ld < ROWS && cs[r + ld][c] !== '#') ld++;
                    list.push({ n: n, dir: 'D', r: r, c: c, len: ld });
                }
            }
        }
        return { cs: cs, list: list, numbers: numbers };
    }

    function entryCells(e) {
        var out = [];
        for (var i = 0; i < e.len; i++) out.push(e.dir === 'A' ? { r: e.r, c: e.c + i } : { r: e.r + i, c: e.c });
        return out;
    }
    function entryAt(r, c, d) {
        for (var i = 0; i < entries.length; i++) {
            var e = entries[i];
            if (e.dir !== d) continue;
            var cs = entryCells(e);
            for (var j = 0; j < cs.length; j++) if (cs[j].r === r && cs[j].c === c) return e;
        }
        return null;
    }
    function currentEntry() { return entryAt(active.r, active.c, dir); }

    function load(idx) {
        puzzleIdx = idx;
        puz = PUZZLES[idx];
        var built = buildEntries(puz.grid);
        cells = built.cs; entries = built.list; nums = built.numbers;
        letters = {}; solved = {}; glowing = {};
        active = null; dir = 'A'; over = false;
        // first open cell
        for (var r = 0; r < ROWS && !active; r++) for (var c = 0; c < COLS; c++) if (cells[r][c] !== '#') { active = { r: r, c: c }; break; }
        buildBoard();
        buildClues();
        buildKeys();
        paint();
        Arcade.ui.setScore(String(streak).padStart(3, '0'));
    }

    function nextPuzzle() {
        load(drawNext(puzzleIdx));
    }

    function buildBoard() {
        var board = document.getElementById('board');
        board.innerHTML = '';
        cellEls = [];
        for (var r = 0; r < ROWS; r++) {
            cellEls[r] = [];
            for (var c = 0; c < COLS; c++) {
                var el = document.createElement('div');
                el.className = 'cw-cell';
                (function (rr, cc) {
                    el.addEventListener('click', function () { onCell(rr, cc); });
                })(r, c);
                board.appendChild(el);
                cellEls[r][c] = el;
            }
        }
    }

    function buildClues() {
        var wrap = document.getElementById('clues');
        wrap.innerHTML = '';
        ['A', 'D'].forEach(function (d) {
            var head = document.createElement('div');
            head.className = 'cw-head';
            head.textContent = d === 'A' ? 'Across' : 'Down';
            wrap.appendChild(head);
        });
        // interleave into two columns: across items then down items
        var cols = { A: document.createElement('div'), D: document.createElement('div') };
        cols.A.style.display = 'flex'; cols.A.style.flexDirection = 'column';
        cols.D.style.display = 'flex'; cols.D.style.flexDirection = 'column';
        entries.filter(function (e) { return e.dir === 'A'; }).forEach(function (e) { cols.A.appendChild(clueEl(e)); });
        entries.filter(function (e) { return e.dir === 'D'; }).forEach(function (e) { cols.D.appendChild(clueEl(e)); });
        wrap.appendChild(cols.A);
        wrap.appendChild(cols.D);
    }

    function clueEl(e) {
        var d = document.createElement('div');
        d.className = 'cw-clue';
        d.id = 'clue-' + entryKey(e);
        d.innerHTML = '<b>' + e.n + (e.dir === 'A' ? 'A' : 'D') + '</b><span>' + puz.clues[entryKey(e)] + '</span>';
        d.addEventListener('click', function () {
            active = { r: e.r, c: e.c }; dir = e.dir; paint();
        });
        return d;
    }

    function buildKeys() {
        var layouts = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
        var wrap = document.getElementById('keys');
        wrap.innerHTML = '';
        for (var r = 0; r < layouts.length; r++) {
            var kr = document.createElement('div');
            kr.className = 'wl-krow';
            if (r === 2) kr.appendChild(makeKey('DIR', true));
            for (var i = 0; i < layouts[r].length; i++) kr.appendChild(makeKey(layouts[r][i], false));
            if (r === 2) kr.appendChild(makeKey('BACK', true));
            wrap.appendChild(kr);
        }
    }
    function makeKey(label, wide) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'wl-key' + (wide ? ' wl-key--wide' : '');
        b.textContent = label === 'BACK' ? '\u232B' : label === 'DIR' ? '\u21C4' : label;
        b.dataset.key = label;
        b.setAttribute('aria-label', label === 'BACK' ? 'Backspace' : label === 'DIR' ? 'Toggle direction' : label);
        b.addEventListener('click', function () { onKey(label); });
        return b;
    }

    function paint() {
        var ae = currentEntry();
        var aeCells = ae ? entryCells(ae) : [];
        function inActiveWord(r, c) {
            for (var i = 0; i < aeCells.length; i++) if (aeCells[i].r === r && aeCells[i].c === c) return true;
            return false;
        }
        function inSolvedWord(r, c) {
            for (var i = 0; i < entries.length; i++) {
                if (!solved[entryKey(entries[i])]) continue;
                var cs = entryCells(entries[i]);
                for (var j = 0; j < cs.length; j++) if (cs[j].r === r && cs[j].c === c) return true;
            }
            return false;
        }
        function inGlowingWord(r, c) {
            for (var i = 0; i < entries.length; i++) {
                if (!glowing[entryKey(entries[i])]) continue;
                var cs = entryCells(entries[i]);
                for (var j = 0; j < cs.length; j++) if (cs[j].r === r && cs[j].c === c) return true;
            }
            return false;
        }
        for (var r = 0; r < ROWS; r++) {
            for (var c = 0; c < COLS; c++) {
                var el = cellEls[r][c];
                if (cells[r][c] === '#') { el.className = 'cw-cell cw-cell--block'; el.innerHTML = ''; continue; }
                var cls = 'cw-cell cw-cell--open';
                if (inSolvedWord(r, c)) cls += ' cw-cell--done';
                else if (inActiveWord(r, c)) cls += ' cw-cell--word';
                if (inGlowingWord(r, c)) cls += ' cw-cell--glow';
                if (active && active.r === r && active.c === c) cls += ' cw-cell--active';
                el.className = cls;
                var num = nums[key(r, c)];
                var L = letters[key(r, c)] || '';
                el.innerHTML = (num ? '<span class="cw-num">' + num + '</span>' : '') + L.toUpperCase();
            }
        }
        // active clue highlight
        var all = document.querySelectorAll('.cw-clue');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('cw-clue--active');
        if (ae) {
            var ce = document.getElementById('clue-' + entryKey(ae));
            if (ce) { ce.classList.add('cw-clue--active'); ce.scrollIntoView({ block: 'nearest' }); }
        }
    }

    function onCell(r, c) {
        if (over || cells[r][c] === '#') return;
        if (active && active.r === r && active.c === c) {
            // same cell: toggle direction if both exist
            var other = dir === 'A' ? 'D' : 'A';
            if (entryAt(r, c, other)) dir = other;
        } else {
            active = { r: r, c: c };
            if (!entryAt(r, c, dir)) dir = dir === 'A' ? 'D' : 'A';
        }
        Arcade.audio.play('tap');
        paint();
    }

    function advance() {
        var e = currentEntry();
        if (!e) return;
        var cs = entryCells(e);
        for (var i = 0; i < cs.length; i++) {
            if (cs[i].r === active.r && cs[i].c === active.c && i < cs.length - 1) {
                active = { r: cs[i + 1].r, c: cs[i + 1].c };
                return;
            }
        }
    }

    function onKey(k) {
        if (over) return;
        if (k === 'DIR') { toggleDir(); return; }
        if (k === 'BACK') {
            var kk = key(active.r, active.c);
            if (letters[kk]) { delete letters[kk]; }
            else {
                var e = currentEntry(); if (e) { var cs = entryCells(e); for (var i = 0; i < cs.length; i++) { if (cs[i].r === active.r && cs[i].c === active.c && i > 0) { active = { r: cs[i - 1].r, c: cs[i - 1].c }; delete letters[key(active.r, active.c)]; break; } } }
            }
            paint();
            Arcade.audio.play('tap');
            return;
        }
        if (!/^[A-Z]$/.test(k)) return;
        letters[key(active.r, active.c)] = k.toLowerCase();
        paint();
        Arcade.audio.play('move');
        checkSolved();
        advance();
        paint();
    }

    function toggleDir() {
        var other = dir === 'A' ? 'D' : 'A';
        if (entryAt(active.r, active.c, other)) { dir = other; paint(); Arcade.audio.play('tap'); }
    }

    function checkSolved() {
        var newly = [];
        for (var i = 0; i < entries.length; i++) {
            var e = entries[i];
            if (solved[entryKey(e)]) continue;
            var cs = entryCells(e), ok = true;
            for (var j = 0; j < cs.length; j++) {
                var L = letters[key(cs[j].r, cs[j].c)] || '';
                if (L !== cells[cs[j].r][cs[j].c]) { ok = false; break; }
            }
            if (ok) {
                solved[entryKey(e)] = true;
                newly.push(e);
            }
        }
        if (newly.length) {
            Arcade.audio.play('merge');
            Arcade.haptics.buzz('light');
            for (var n = 0; n < newly.length; n++) {
                var ek = entryKey(newly[n]);
                glowing[ek] = true;
                (function (k) {
                    setTimeout(function () { delete glowing[k]; paint(); }, 1100);
                })(ek);
            }
            paint();
            var allSolved = entries.every(function (en) { return solved[entryKey(en)]; });
            if (allSolved) win();
        }
    }

    function win() {
        over = true;
        streak++;
        saveStreak();
        var res = Arcade.scores.submit('five-letter', streak);
        Arcade.audio.play('fanfare');
        Arcade.haptics.buzz('success');
        Arcade.ui.setScore(String(streak).padStart(3, '0'));
        Arcade.ui.gameOver({
            title: 'SOLVED',
            label: 'Mini complete · streak',
            score: streak,
            best: res.best, isNew: res.isNew,
            replayLabel: 'Next',
            onReplay: function () { nextPuzzle(); }
        });
    }

    document.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === 'Backspace') { e.preventDefault(); onKey('BACK'); }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onKey('DIR'); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1, 0); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); move(1, 0); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); move(0, -1); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); move(0, 1); }
        else if (/^[a-zA-Z]$/.test(e.key)) onKey(e.key.toUpperCase());
    });

    function move(dr, dc) {
        if (over) return;
        var r = active.r + dr, c = active.c + dc;
        while (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
            if (cells[r][c] !== '#') { active = { r: r, c: c }; paint(); return; }
            r += dr; c += dc;
        }
    }

    Arcade.init({
        slug: 'five-letter',
        title: 'Five Letter',
        accent: 'yellow',
        onPause: function () {},
        onResume: function () {}
    });

    streak = readStreak();
    refillDeck();
    load(drawNext(-1));
})();
</script>
